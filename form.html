<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Artifact Collector - Add Artifact</title>
  <link rel="stylesheet" href="static/brand.css">
</head>
<body>
  <header>
    <nav>
      <a href="mockup.html">Back to Collections</a>
    </nav>
    <h1>Artifact Collector: Add Entry</h1>
  </header>

  <main>
    <h2>Make Your Artifact</h2>
    <form action="#" method="post">
      <div>
        <label for="artifact-title">Artifact or Game Title:</label>
        <input id="artifact-title" name="artifact_title" type="text" placeholder="e.g. Starry Night / Elden Ring">
      </div>

      <div>
        <label for="category">Category:</label>
        <select id="category" name="category">
          <option value="lego">LEGO</option>
          <option value="books">Books</option>
          <option value="pokemon">Pokémon</option>
          <option value="games">Video Games</option>
        </select>
      </div>

      <div>
        <label for="status">Collection Status:</label>
        <select id="status" name="status">
          <option value="collected">COLLECTED ✓</option>
          <option value="missing">MISSING ○</option>
          <option value="wishlist">WISHLIST ★</option>
        </select>
      </div>

      <button type="submit">Save Artifact</button>
    </form>
  </main>
</body>
</html>
